basemodel: "narre"
data:
  use_review_text: true
  use_review_embedding: false
  use_sentiment: false
  glove_path: "/home/infolab/mnt/mingyu/review_rec/cached/others/GoogleNews-vectors-negative300.txt"
model:
  review_count: 10
  review_length: 40
  word_dim: 300
  kernel_count: 100
  kernel_size: 3
  filter_sizes: [3]
  id_dim: 32
  attention_size: 32
  dropout_prob: 0.5
  freeze_word_embedding: false
  l2_reg_lambda: 0.0
  mask_padding_attention: true
  word_embedding_cpu: false
  retain_rui: true
training:
  batch: 32
  epoch: 200
  lr: 0.002
  lr_decay: 0.95
  weight_decay: 0.0
evaluation:
  min_rating: 1.0
  max_rating: 5.0
