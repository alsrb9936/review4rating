basemodel: "narre"
data:
  use_review_text: true
  use_review_embedding: false
  use_sentiment: false
  glove_path: "/home/infolab/mnt/mingyu/review_rec/cached/others/GoogleNews-vectors-negative300.txt"
  drop_cold_start_eval: false
model:
  # original: reproduce chenchongthu/NARRE pro_data/data_pro.py preprocessing
  # fair: use train-only metadata with target-review/cold-start leakage avoided via
  #       retain_rui=false, original_cold_start_dummy=false, drop_cold_start_eval=true
  narre_preprocess_mode: "original"
  auto_review_shape: true
  original_cold_start_dummy: true
  word_dim: 300
  kernel_count: 100
  kernel_size: 3
  filter_sizes: [3]
  id_dim: 32
  attention_size: 32
  dropout_prob: 0.3
  freeze_word_embedding: false
  l2_reg_lambda: 0.001
  mask_padding_attention: false
  word_embedding_cpu: false
  retain_rui: false
training:
  batch: 128
  epoch: 500
  lr: 0.002
  lr_decay: 0.95
  weight_decay: 0.001
evaluation:
  early_stop_patience: 10
  eval_clip: false
  min_rating: 1.0
  max_rating: 5.0
