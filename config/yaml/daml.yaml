basemodel: "daml"
data:
  use_review_text: true
  use_review_embedding: false
  use_sentiment: false
  glove_path: "/home/infolab/mnt/mingyu/review_rec/cached/others/GoogleNews-vectors-negative300.txt"
  drop_cold_start_eval: false
model:
  doc_len: 500
  word_dim: 300
  filters_num: 100
  kernel_size: 3
  id_emb_size: 32
  dropout_prob: 0.5
  l2_reg_lambda: 0.001
  freeze_word_embedding: false
training:
  batch: 128
  epoch: 20
  lr: 0.002
  lr_decay: 0.95
  weight_decay: 0.001
evaluation:
  early_stop_patience: 10
  eval_clip: false
  min_rating: 1.0
  max_rating: 5.0
