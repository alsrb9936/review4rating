training:
  batch: 256
  eval_batch: 256
  epoch: 200
  lr: 0.001
  weight_decay: 0.0

evaluation:
  eval_step: 1
  early_stop_patience: 10
  best_metric_name: "rmse"
  eval_clip: true
  drop_cold_start_eval: true
  min_rating: 1.0
  max_rating: 5.0

model:
  embedding_size: 64
  dropout_prob: 0.1

data:
  data_path: "/home/infolab/mnt/mingyu/review_rec/dataset"
  other_path: "/home/infolab/mnt/mingyu/review_rec/cached/others"
  embedding_path: "/home/infolab/mnt/mingyu/review_rec/cached/embedding"
  sentiment_path: "/home/infolab/mnt/mingyu/review_rec/cached/sentiment"
  sentiment_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  language_model: "sentence-transformers/all-MiniLM-L12-v2"
  use_review_text: false
  use_review_embedding: false
  compute_review_embedding: false  # Legacy alias; use_review_embedding=true now loads cache or computes if missing.
  use_sentiment: false
  review_emb_path: null
  use_bert_whitening: false
  bert_whitening_model: "bert-base-uncased"
  bert_whitening_dim: 64
  bert_whitening_pooling: "cls"  # cls | mean
  bert_whitening_normalize: true
  bert_whitening_cache_scope: "full"  # full | split
  bert_whitening_stats_path: null
