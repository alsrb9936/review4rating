basemodel: "iard_rm"

model:
  name: "iard_rm"
  d_id: 64
  d_text: 384
  review_emb_dim: null
  review_context_mode: "history"
  history_aggregation: "mean"
  history_encoder: "mean"
  history_top_k: 50
  history_temporal: false
  retain_rui: false
  d_model: 128
  num_layers: 1
  num_intents: 5
  eta: 0.6
  dropout: 0.2
  tau_p: 0.2
  gate_alpha: 5.0
  shared_fusion_scale: 1.0
  residual_fusion_scale: 1.0
  fixed_gate_value: null
  disentangler_mode: "conditioned"

loss:
  loss_preset: full_iard
  lambda_rating: 1.0
  lambda_align: 0.1
  lambda_sep: 0.05
  lambda_recon: 0.1
  lambda_gate: 0.001
  lambda_proto: 0.01
  tau_c: 0.2
  eps: 1e-8
  detach_gate_for_align: true
  detach_zx_for_recon: false

training:
  batch: 64
  eval_batch: 64
  epoch: 200
  lr: 0.0002
  weight_decay: 0.0
  grad_clip: 1.0

evaluation:
  eval_step: 1
  early_stop_patience: 10
  best_metric_name: "rmse"
  metrics: ["rmse", "mse", "mae"]
  clamp_eval_pred: true

data:
  use_review_text: false
  use_review_embedding: true
  compute_review_embedding: true  # Legacy alias; cache is loaded when present and computed only when missing.
  use_sentiment: true
  review_emb_path: null
