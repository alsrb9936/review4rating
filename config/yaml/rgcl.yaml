# RGCL Configuration
# Review Graph Contrastive Learning with GCMC

model:
  name: "rgcl"
  
  # Embedding dimensions
  embedding_size: 64
  
  # Graph convolution settings
  num_layers: 1
  dropout: 0.7
  node_dropout: 0.8
  
  # Review feature settings
  # sentence-transformer cache default is 384.
  review_dim: 384
  use_review: true  # Whether to use review features
  symm: true  # Symmetric normalization
  
  # Contrastive learning settings
  use_contrastive: true
  nd_weight: 0.3
  ed_weight: 1.0
  
  # Prediction mode
  classification: true

training:
  batch: 1
  eval_batch: 1
  epoch: 400
  lr: 0.01
  weight_decay: 0.0
  early_stop_patience: 50
  grad_clip: 1.0  # Gradient clipping threshold
  eval_step: 1

evaluation:
  best_metric_name: "rmse"
  metrics: ["rmse", "mse", "mae"]
  eval_clip: false
# Data paths and settings
data:
  use_cached_graphs: true  # Cache constructed graphs
  use_review_text: false
  use_review_embedding: true
  compute_review_embedding: true  # Legacy alias; cache is loaded when present and computed only when missing.
  use_sentiment: false
  use_bert_whitening: false
